<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Saudade · Voces</title>
  <meta name="description" content="«Saudade» recitado por Juan.">
  <meta property="og:title"       content="Saudade">
  <meta property="og:description" content="Recitado por Juan">
  <meta property="og:image"       content="https://cdccris.github.io/poemas/Juan/cover.png">
  <meta property="og:type"        content="website">
  <meta name="twitter:card"       content="summary_large_image">
  <meta name="twitter:image"      content="https://cdccris.github.io/poemas/Juan/cover.png">
  <meta name="theme-color"        content="#f2efe8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: #1a1a1a;
      background: radial-gradient(900px 520px at 60% -5%, rgba(100,95,160,0.1), transparent 55%),
                  linear-gradient(180deg, #f2efe8, #f2efe8);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px 16px;
    }
    #read-progress {
      position: fixed; top: 0; left: 0; height: 2px; width: 0%;
      background: #2a2520; z-index: 100;
      box-shadow: 0 0 6px #2a2520; transition: width 0.1s linear;
    }
    .card {
      width: 100%; max-width: 520px;
      background: linear-gradient(160deg,rgba(255,255,255,0.75),rgba(255,255,255,0.55));
      border: 1px solid rgba(26,26,26,0.14);
      border-radius: 24px;
      box-shadow: 0 20px 70px rgba(0,0,0,.45);
      padding: 28px 28px 32px;
      backdrop-filter: blur(12px);
      display: flex; flex-direction: column; align-items: center;
    }
    .back {
      align-self: flex-start; font-size: 14px; font-style: italic;
      color: #5a5450; text-decoration: none;
      opacity: 0.7; margin-bottom: 22px; transition: opacity .2s;
    }
    .back:hover { opacity: 1; }
    .cover {
      width: 200px; height: 200px;
      border-radius: 16px; object-fit: cover;
      border: 1px solid rgba(26,26,26,0.14);
      background: #f2efe8;
      display: block; margin-bottom: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      font-size: clamp(22px, 5vw, 34px);
      line-height: 1.2; text-align: center;
      margin-bottom: 6px; letter-spacing: 0.02em;
      color: #1a1a1a;
    }
    .meta {
      font-size: 15px; font-style: italic;
      text-align: center; margin-bottom: 8px;
      letter-spacing: 0.04em; color: #5a5450;
      opacity: 0.85;
    }
    .reciter {
      font-family: 'Cinzel', serif; font-size: 11px;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: #2a2520; opacity: 0.9;
      text-align: center; margin-bottom: 22px;
    }
    audio {
      width: 100%; outline: none;
      accent-color: #2a2520; margin-bottom: 18px;
    }
    .actions {
      display: flex; gap: 10px; flex-wrap: wrap;
      justify-content: center; margin-bottom: 10px;
    }
    .btn {
      appearance: none; border: none; cursor: pointer;
      background: #2a2520; color: #f2efe8;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 700; font-size: 15px;
      padding: 11px 22px; border-radius: 12px;
      transition: .15s transform, .15s filter;
      text-decoration: none; display: inline-flex; align-items: center;
    }
    .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn.secondary {
      background: transparent; color: #1a1a1a;
      border: 1px solid rgba(26,26,26,0.14);
    }
    .hint {
      font-size: 13px; font-style: italic;
      text-align: center; color: #5a5450; opacity: 0.75;
    }
    @media (max-width: 480px) {
      body { padding: 16px 12px; align-items: flex-start; padding-top: 32px; }
      .card { padding: 22px 18px 28px; }
      .cover { width: 160px; height: 160px; }
    }
  </style>
</head>
<body>
  <div id="read-progress"></div>
  <main class="card">
    <a class="back" href="https://cdccris.github.io/poemas/ElLenguajeDelSilencio/">← El lenguaje del silencio</a>
    <img class="cover"
         src="https://cdccris.github.io/poemas/Juan/cover.png"
         alt="Portada de Saudade"
         onerror="this.style.display='none'">
    <h1>Saudade</h1>
    <div class="meta">de Cristina Del Campo</div>
    <div class="reciter">Recitado por Juan</div>
    <audio id="player" controls preload="metadata">
      <source src="https://cdccris.github.io/poemas/Juan/audio.m4a" type="audio/mp4">
      <source src="https://cdccris.github.io/poemas/Juan/audio.mp3" type="audio/mpeg">
      Tu navegador no soporta el elemento de audio.
    </audio>
    <div class="actions">
      <a class="btn" href="https://cdccris.github.io/poemas/Juan/audio.mp3"
         download="Juan_Voces.mp3">Descargar MP3</a>
      <button class="btn secondary" id="share">Compartir</button>
    </div>
    <p class="hint">En móviles pulsa ▶ para empezar.</p>
  </main>
  <script>
    window.addEventListener('scroll', () => {
      const bar = document.getElementById('read-progress');
      const total = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = total > 0 ? (window.scrollY/total*100)+'%' : '100%';
    }, {passive:true});
    const s = document.getElementById('share');
    if (navigator.share) {
      s.addEventListener('click', () => navigator.share({
        title: 'Saudade',
        text: '«Saudade» de Cristina Del Campo, recitado por Juan',
        url: location.href
      }));
    } else { s.style.display='none'; }
    const p = document.getElementById('player');
    document.addEventListener('keydown', e => {
      if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
      if (e.code==='Space'||e.key==='k'){ e.preventDefault(); p.paused?p.play():p.pause(); }
      if (e.key==='ArrowRight') p.currentTime=Math.min(p.duration||0,p.currentTime+5);
      if (e.key==='ArrowLeft')  p.currentTime=Math.max(0,p.currentTime-5);
    });
  </script>
</body>
</html>
