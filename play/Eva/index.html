<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>:)</title>
  <meta name="description" content="«:)» recitado por Eva.">
  <meta property="og:title"        content=":)">
  <meta property="og:description"  content="Recitado por Eva">
  <meta property="og:image"        content="https://cdccris.github.io/poemas/Eva/cover.png">
  <meta property="og:type"         content="website">
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:image"       content="https://cdccris.github.io/poemas/Eva/cover.png">
  <meta name="theme-color"         content="#0f0f0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1:#0f0f0f; --bg2:rgba(80,10,10,0.3);
      --accent:#c8c0b0; --text:#f0ece4; --muted:#9a9088;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--text);
      background: radial-gradient(900px 520px at 60% -5%, var(--bg2), transparent 55%),
                  linear-gradient(180deg, var(--bg1), #0f0f0f);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 32px 16px 80px;
    }
    #read-progress {
      position: fixed; top: 0; left: 0; height: 2px; width: 0%;
      background: var(--accent); z-index: 100;
      box-shadow: 0 0 6px var(--accent); transition: width 0.1s linear;
    }
    .card {
      width: 100%; max-width: 560px;
      background: linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0.02));
      border: 1px solid rgba(200,192,176,0.15);
      border-radius: 24px; box-shadow: 0 16px 60px rgba(0,0,0,.35);
      padding: 28px 28px 36px; backdrop-filter: blur(10px);
      display: flex; flex-direction: column; align-items: center;
    }
    .back {
      align-self: flex-start; font-size: 14px; font-style: italic;
      color: var(--muted); text-decoration: none;
      opacity: 0.65; margin-bottom: 20px; transition: opacity .2s;
    }
    .back:hover { opacity: 1; }
    .cover {
      width: 180px; height: 180px; border-radius: 16px; object-fit: cover;
      border: 1px solid rgba(200,192,176,0.15); background: var(--bg2);
      display: block; margin-bottom: 20px;
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600;
      font-size: clamp(22px, 5vw, 32px); line-height: 1.2;
      text-align: center; margin-bottom: 6px; letter-spacing: 0.02em;
    }
    .meta {
      color: var(--muted); font-size: 15px; font-style: italic;
      text-align: center; margin-bottom: 8px; letter-spacing: 0.04em;
    }
    .reciter {
      font-family: 'Cinzel', serif; font-size: 11px;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--accent); opacity: 0.85;
      text-align: center; margin-bottom: 20px;
    }
    audio {
      width: 100%; outline: none; accent-color: var(--accent); margin-bottom: 16px;
    }
    .actions {
      display: flex; gap: 10px; flex-wrap: wrap;
      justify-content: center; margin-bottom: 8px;
    }
    .btn {
      appearance: none; border: none; cursor: pointer;
      background: var(--accent); color: #0f0f0f;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600; font-size: 15px;
      padding: 10px 20px; border-radius: 12px;
      transition: .15s transform, .15s filter;
      text-decoration: none; display: inline-flex; align-items: center;
    }
    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn.secondary {
      background: transparent; color: var(--text);
      border: 1px solid rgba(200,192,176,0.15);
    }
    .hint {
      font-size: 13px; color: var(--muted); font-style: italic;
      text-align: center;
    }
    @media (max-width: 480px) {
      body { padding: 20px 12px 60px; }
      .card { padding: 22px 18px 28px; }
      .cover { width: 140px; height: 140px; }
    }
  </style>
</head>
<body>
  <div id="read-progress"></div>
  <main class="card">
    <a class="back" href="https://cdccris.github.io/poemas/VeteParaNoDoler/">← Vete para no doler</a>
    <img class="cover" src="https://cdccris.github.io/poemas/Eva/cover.png" alt="Portada" onerror="this.style.display='none'">
    <h1>:)</h1>
    <div class="meta">de Cristina Del Campo</div>
    <div class="reciter">Recitado por Eva</div>
    <audio id="player" controls preload="metadata">
      <source src="https://cdccris.github.io/poemas/Eva/audio.m4a" type="audio/mp4">
      <source src="https://cdccris.github.io/poemas/Eva/audio.mp3" type="audio/mpeg">
      Tu navegador no soporta el elemento de audio.
    </audio>
    <div class="actions">
      <a class="btn" href="https://cdccris.github.io/poemas/Eva/audio.mp3"
         download="Eva.mp3">Descargar MP3</a>
      <button class="btn secondary" id="share">Compartir</button>
    </div>
    <p class="hint">En móviles pulsa ▶ para empezar.</p>
  </main>
  <script>
    window.addEventListener('scroll', () => {
      const bar = document.getElementById('read-progress');
      const total = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = total > 0 ? (window.scrollY/total*100)+'%' : '100%';
    }, {passive:true});
    const shareBtn = document.getElementById('share');
    if (navigator.share) {
      shareBtn.addEventListener('click', () => navigator.share({
        title: ':)',
        text: 'Escucha «:)» de Cristina Del Campo, recitado por Eva',
        url: location.href
      }));
    } else { shareBtn.style.display='none'; }
    const player = document.getElementById('player');
    document.addEventListener('keydown', e => {
      if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
      if (e.code==='Space'||e.key==='k'){ e.preventDefault(); player.paused?player.play():player.pause(); }
      if (e.key==='ArrowRight') player.currentTime=Math.min(player.duration||0,player.currentTime+5);
      if (e.key==='ArrowLeft')  player.currentTime=Math.max(0,player.currentTime-5);
    });
  </script>
</body>
</html>
